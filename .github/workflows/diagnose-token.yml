name: Diagnose registry token

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Which token sees which identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WF_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          echo "=== secrets.GH_TOKEN presence ==="
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GH_TOKEN is EMPTY"
          else
            echo "GH_TOKEN length: ${#GH_TOKEN}"
          fi
          echo
          echo "=== secrets.GITHUB_TOKEN presence ==="
          echo "length: ${#WF_TOKEN}"
          echo
          echo "=== gh token scopes (classic) ==="
          for name in GH_TOKEN WF_TOKEN; do
            token=${!name}
            [ -n "${token:-}" ] || { echo "$name: missing"; continue; }
            who=$(curl -s -H "Authorization: Bearer $token" https://api.github.com/user | jq -r '.login // "invalid"')
            echo "$name identity: $who"
          done
          echo
          echo "=== workflow token scopes header ==="
          curl -s -i -H "Authorization: Bearer $WF_TOKEN" https://api.github.com/user \
            | grep -iE '^(x-oauth-scopes|x-accepted-oauth-scopes):' || true
          echo
          echo "=== repo package write probe (workflow token) ==="
          pack=$(curl -s -H "Authorization: Bearer $WF_TOKEN" \
            "https://api.github.com/repos/33mmRRee-org/Container" | jq -r '.permissions.push // "?"')
          echo "Container push permission: $pack"
          echo
          echo "=== org package list with workflow token ==="
          curl -s -o /dev/null -w 'orgs packages HTTP=%{http_code}\n' \
            -H "Authorization: Bearer $WF_TOKEN" \
            https://api.github.com/orgs/33mmRRee-org/packages?package_type=container
