name: Build base images
run-name: "Build: ${{ inputs.distribution || github.event.client_payload.distribution || 'all' }} ${{ inputs.version || 'versions' }}${{ inputs.verify_only && ' (verify)' || '' }}"

on:
  repository_dispatch:
    types: [source-mirrors-updated]
  workflow_dispatch:
    inputs:
      distribution:
        type: choice
        required: true
        default: all
        options: [all, Ubuntu, Debian, Centos, Alpine, Fedora, AlmaLinux, ArchLinux, RockyLinux]
      version:
        description: Release to build, or all
        type: string
        default: all
      verify_only:
        description: Build and run tests without publishing
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  packages: write
  # Docker Scout SARIF results are uploaded to code scanning.
  security-events: write

concurrency:
  group: base-images-${{ inputs.verify_only && format('verify-{0}-{1}', inputs.distribution, inputs.version || 'all') || 'publish' }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      has-builds: ${{ steps.plan.outputs.has-builds }}
      releases: ${{ steps.plan.outputs.releases }}
      has-releases: ${{ steps.plan.outputs.has-releases }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: inputs.verify_only != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN_CLASSIC }}
      - name: Log in to Docker Hub
        if: inputs.verify_only != true
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME || 'thebigman' }}
          password: ${{ secrets.DOCKER_SECRET }}
      - name: Log in to Quay
        if: inputs.verify_only != true
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_NAME }}
          password: ${{ secrets.QUAY_SECRET }}
      - name: Discover releases and architectures
        id: plan
        env:
          SELECTED: ${{ inputs.distribution || github.event.client_payload.distribution || 'all' }}
          VERSION: ${{ inputs.version || 'all' }}
          VERIFY_ONLY: ${{ inputs.verify_only || false }}
          QUAY_NAME: ${{ secrets.QUAY_NAME }}
        run: |
          arguments=()
          [[ "$VERIFY_ONLY" != true ]] || arguments+=(--verify-only)
          python3 scripts/discover-builds.py --distribution "$SELECTED" --version "$VERSION" "${arguments[@]}" > build-plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: build-plan
          path: build-plan.json

  build:
    name: "Build+Test: ${{ matrix.distribution }} ${{ matrix.version }} · ${{ matrix.architecture }}"
    needs: discover
    if: needs.discover.outputs.has-builds == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Building and testing on one runner removes the stage barrier: a finished
      # target frees its slot immediately instead of waiting for the slowest
      # build of the whole matrix. 20 matches the GitHub Free concurrency limit.
      max-parallel: 20
      matrix: ${{ fromJSON(needs.discover.outputs.targets || '{"include":[]}') }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore package downloads
        id: packages
        uses: actions/cache/restore@v5
        with:
          # The package index fingerprint deliberately stays out of the key.
          # Including it produced a new entry on every upstream index change and
          # pushed the cache towards eviction, which slowed later builds down.
          path: ${{ runner.temp }}/package-cache
          key: packages-v1-${{ matrix.key }}
          restore-keys: packages-v1-${{ matrix.key }}
      - uses: docker/setup-qemu-action@v4
        if: matrix.emulation != ''
        with:
          platforms: ${{ matrix.emulation }}
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.architecture }}
        id: compile
        env:
          BUILD_TARGET: ${{ toJSON(matrix) }}
          PACKAGE_CACHE: ${{ runner.temp }}/package-cache
        run: |
          mkdir -p "$PACKAGE_CACHE"
          bash build-base.sh
      - name: Export built image for Publish
        id: archive
        run: bash scripts/image-artifact.sh save "$RUNNER_TEMP/built"
      - name: Transfer built image
        if: steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: built-${{ matrix.key }}
          path: ${{ runner.temp }}/built
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Test ${{ matrix.architecture }}
        id: test
        if: steps.compile.outcome == 'success'
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/test-images.sh "$DISTRIBUTION" "$RUNNER_TEMP/image-test-list.txt"
      # Scout needs a tested image. Without this guard a failed build left no
      # image.json, so the reports and the SARIF upload produced three failure
      # messages that hid the real build error.
      - name: Install Docker Scout CLI
        if: always() && inputs.verify_only != true && steps.test.outcome == 'success'
        continue-on-error: true
        env:
          SCOUT_VERSION: 1.30.0
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) printf 'Unsupported architecture: %s\n' "$(uname -m)" >&2; exit 0 ;;
          esac
          archive="docker-scout_${SCOUT_VERSION}_linux_${arch}.tar.gz"
          base="https://github.com/docker/scout-cli/releases/download/v${SCOUT_VERSION}"
          mkdir -p "$HOME/.docker/cli-plugins"
          # Many matrix jobs download the same asset at once, which GitHub
          # answers with 403 rate limiting. Back off instead of failing.
          fetch() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --location "$1" --output "$2"; then
                return 0
              fi
              ((attempt < 5)) || return 1
              sleep "$((attempt * 10))"
            done
          }
          fetch "$base/$archive" /tmp/scout.tar.gz
          fetch "$base/docker-scout_${SCOUT_VERSION}_checksums.txt" /tmp/scout-checksums.txt
          # The checksum file separates hash and name with two spaces, so match
          # the entry by name and verify the hash instead of relying on grep.
          expected=$(awk -v name="$archive" '$2 == name {print $1}' /tmp/scout-checksums.txt)
          actual=$(sha256sum /tmp/scout.tar.gz | awk '{print $1}')
          [ -n "$expected" ] && [ "$expected" = "$actual" ] \
            || { printf 'Scout CLI checksum mismatch.\n' >&2; exit 1; }
          tar -xzf /tmp/scout.tar.gz -C "$HOME/.docker/cli-plugins" docker-scout
          chmod +x "$HOME/.docker/cli-plugins/docker-scout"
          docker scout version
      - name: Generate SBOM and vulnerability reports
        id: scout
        if: always() && inputs.verify_only != true && steps.test.outcome == 'success'
        continue-on-error: true
        env:
          SCOUT_ORG: ${{ vars.SCOUT_ORG }}
        run: |
          reference=$(jq -er .image "$RUNNER_TEMP/image.json")
          if bash scripts/scout-report.sh "$reference" "$RUNNER_TEMP/scout"; then
            printf 'Scout reports generated for %s\n' "$reference"
          else
            printf 'Scout reporting unavailable; build result unchanged.\n' >&2
          fi
          if [ -s "$RUNNER_TEMP/scout/vulnerabilities.sarif" ]; then
            echo 'sarif=true' >> "$GITHUB_OUTPUT"
          else
            echo 'sarif=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Scout findings to code scanning
        # upload-sarif fails the step when the file is absent, so the report step
        # records whether a SARIF file exists and this step only runs when it does.
        if: always() && inputs.verify_only != true && steps.scout.outputs.sarif == 'true'
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: ${{ runner.temp }}/scout/vulnerabilities.sarif
          category: scout-${{ matrix.key }}
      - name: Save Scout reports
        if: always() && inputs.verify_only != true && steps.test.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: scout-${{ matrix.key }}
          path: ${{ runner.temp }}/scout
          retention-days: 30
          if-no-files-found: ignore
      - name: Save tested image approval
        if: steps.test.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.key }}
          path: ${{ runner.temp }}/image.json
          retention-days: 7
          if-no-files-found: error
      - name: Record result
        if: always()
        env:
          BUILD_TARGET: ${{ toJSON(matrix) }}
          BUILD_RESULT: ${{ steps.compile.outcome == 'success' && steps.archive.outcome == 'success' && 'success' || 'failure' }}
          TEST_RESULT: ${{ steps.test.outcome }}
          CACHE_HIT: ${{ steps.packages.outputs.cache-matched-key != '' }}
        run: python3 scripts/summarize-builds.py record "$RUNNER_TEMP/status.json"
      - name: Save result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: status-build-${{ matrix.key }}
          path: ${{ runner.temp }}/status.json
          retention-days: 7
          if-no-files-found: error
      - name: Keep package download cache bounded
        if: always()
        env:
          PACKAGE_CACHE: ${{ runner.temp }}/package-cache
        run: |
          mkdir -p "$PACKAGE_CACHE"
          sudo chown -R "$(id -u):$(id -g)" "$PACKAGE_CACHE"
          bash scripts/package-cache.sh --prune
      - name: Save package downloads
        # Only cache a directory that actually holds packages; empty or pruned
        # caches used to be stored and then evicted, wasting cache quota.
        if: always() && steps.packages.outputs.cache-hit != 'true' && steps.packages.outputs.cache-matched-key == ''
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/package-cache
          key: ${{ steps.packages.outputs.cache-primary-key }}


  publish:
    name: "Publish: ${{ matrix.distribution }} ${{ matrix.version }}"
    needs: [discover, build]
    if: always() && !cancelled() && needs.discover.result == 'success' && needs.discover.outputs.has-releases == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.discover.outputs.releases || '{"include":[]}') }}
    env:
      DISTRIBUTION: ${{ matrix.distribution }}
      VERSION: ${{ matrix.version }}
      RELEASE_KEY: ${{ matrix.key }}
      HAS_CHANGES: ${{ matrix.has_changes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-plan
          path: plan
      - name: Download this release's test approvals
        if: env.HAS_CHANGES == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: image-${{ env.RELEASE_KEY }}-*
          path: results
      - name: Log in to GHCR
        if: inputs.verify_only != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN_CLASSIC }}
      - name: Log in to Docker Hub
        if: inputs.verify_only != true
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME || 'thebigman' }}
          password: ${{ secrets.DOCKER_SECRET }}
      - name: Log in to Quay
        if: inputs.verify_only != true
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_NAME }}
          password: ${{ secrets.QUAY_SECRET }}
      - name: Publish only when every architecture passed
        id: publication
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_CLASSIC }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME || 'thebigman' }}
          DOCKER_SECRET: ${{ secrets.DOCKER_SECRET }}
          QUAY_NAME: ${{ secrets.QUAY_NAME }}
          QUAY_SECRET: ${{ secrets.QUAY_SECRET }}
          VERIFY_ONLY: ${{ inputs.verify_only || false }}
          PUBLICATION_RESULT: ${{ runner.temp }}/publication.json
        run: |
          mkdir -p results
          arguments=()
          [[ "$VERIFY_ONLY" != true ]] || arguments+=(--validate-only)
          python3 scripts/publish-release.py plan/build-plan.json results --distribution "$DISTRIBUTION" --version "$VERSION" "${arguments[@]}"
      - name: Save push results
        if: always() && inputs.verify_only != true
        uses: actions/upload-artifact@v7
        with:
          name: status-push-${{ env.RELEASE_KEY }}
          path: ${{ runner.temp }}/push-status
          retention-days: 7
          if-no-files-found: ignore
      - name: Save publication result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publication-${{ env.RELEASE_KEY }}
          path: ${{ runner.temp }}/publication.json
          retention-days: 7
          if-no-files-found: error

  summary:
    name: Results
    needs: [discover, publish]
    if: always() && !cancelled() && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-plan
          path: plan
      - uses: actions/download-artifact@v8
        with:
          pattern: status-*
          path: results
      - uses: actions/download-artifact@v8
        with:
          pattern: publication-*
          path: results
      - name: Group distribution results by architecture
        run: python3 scripts/summarize-builds.py report plan/build-plan.json results
      - name: Save grouped results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-summary
          path: ${{ runner.temp }}/results-summary.md